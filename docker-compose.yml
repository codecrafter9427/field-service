# PostgreSQL only — local demo database for Field Service MVP
# Host port 5434 avoids clashes with sibling portfolio products.
services:
  db:
    image: postgres:16-alpine
    container_name: field-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-field_service}
      POSTGRES_USER: ${POSTGRES_USER:-field_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - field_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-field_service} -d ${POSTGRES_DB:-field_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  field_service_pgdata:
